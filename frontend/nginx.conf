server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Gzip compression for lightning-fast mobile loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Reverse Proxy for Card Scan URLs (/c/CODE)
    # Allows instant 302 redirect directly from domain.com/c/MMHBWS
    location /c/ {
        proxy_pass http://backend:8000/c/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # 2. Reverse Proxy for Backend REST APIs (/api/*)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Reverse Proxy for Swagger Docs & Direct Health Check
    location ~ ^/(health|docs|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # 5. React SPA Fallback (Handles /activate/:code, /admin, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
